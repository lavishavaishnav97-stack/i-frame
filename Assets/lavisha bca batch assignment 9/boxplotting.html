<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            width: 800px;
            background-color: teal;
            justify-content: center;
            align-items: center;
            margin: auto;
            display: flex;
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: skyblue;
        }
            .box1{
            height: 80%;
            width: 80%;
            margin: 40px 20px 20px 60px;
            padding: 60px 20px 20px 80px;
            border: 20px solid navy;
            background-color: blue;
            }
            .box2{
            height: 80%;
            width: 80%;
            background-color:rgb(255, 128, 0);
            text-align: center;
            line-height: 150px;         
            }

            .margin{
                position: absolute;
                top: 100px;
                left: 760px;
            }
            .box1>.border{
                position: absolute;
                top: 130px;
                left: 760px;
                color: white;
            }
            .padding{
                position: absolute ;
                top: 170px;
                left: 760px;
                color: white;
                
                               }             
        
        *{
            text-transform: capitalize;
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align="center">box plotting</h1>
<div class="con">
    <div class="box">
        <p class="margin">margin</p>
        <div class="box1">
            <p class="border">border</p>
            <p class="padding">padding</p>
            <div class="box2">content</div>
        </div>
    </div>
</div>

    
</body>
</html>
