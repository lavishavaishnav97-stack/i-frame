8<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;
            color: black;
        }
    .con{
    height: 600px;
    border: 1px solid black;
}
    .header{
    height: 20%;
    background-color:rgb(144, 232, 238);
    border: 1px solid black;
}
     .center{
    height: 60%;
    background-color:rgb(241, 185, 243);
    display: flex;
     }    
    

    .left{
    height: 100%;
    width: 20%;
    border: 1px solid black;
}
    .right{
    
    width: 80%;
    border: 1px solid black;
    background-color: rgb(247, 150, 132);
    
}
    .top {
        height: 50%;
        width: 100%;
        background-color: rgb(163, 241, 160);
        border: 1px solid black;
    }
    .bottom{
        height: 50%;
        background-color: rgb(105, 171, 238);
        border: 1px solid black;
        display: flex;
    }
    .leftbox{
        height: 100%;
        width: 50%;
        background-color: rgb(170, 98, 218);
        border: 1px solid black;
    }
.rightbox{
    height: 100%;
    width: 50%;
    background-color: rgb(48, 233, 202);
    border: 1px solid black;
}
.footer{
    height: 20%;
    border: 1px solid black;
    background-color: rgb(243, 61, 29);

}


    </style>
</head>
<body>  
    <h1 align =" center">Flex Box</h1>  
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="leftbox"></div>
                    <div class="rightbox"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>

</body>
</html>
